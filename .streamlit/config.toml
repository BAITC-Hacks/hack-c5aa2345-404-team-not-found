[browser]
gatherUsageStats = false

[server]
headless = true
maxUploadSize = 500
address = "127.0.0.1"
enableCORS = true
enableXsrfProtection = true

[theme]
base = "light"
primaryColor = "#137f76"
backgroundColor = "#f4f7f9"
secondaryBackgroundColor = "#ffffff"
textColor = "#1d2b3a"
font = "sans serif"
